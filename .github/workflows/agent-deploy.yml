# Reusable deploy step: check the environment's Azure config against policy.json (G2), create the agent
# version from code, record it, smoke-test it, and (prod only) roll back if the smoke test fails.
# Hosted agents (agent.json "kind": "hosted"): with build_image the image is built, scanned (G1) and pushed to
# this environment's registry first; otherwise the given image digest is deployed (copied into this
# environment's registry if it lives elsewhere).
name: agent-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and config/<environment>.json to deploy
        type: string
        required: true
      agent_dir:
        description: Agent folder relative to cicd/
        type: string
        required: true
      rollback_on_smoke_failure:
        description: Roll back when the smoke test fails, or when a new hosted version never becomes active (prod)
        type: boolean
        default: false
      build_image:
        description: Hosted agents only - build, scan and push the image in this job (the first deploy of a run)
        type: boolean
        default: false
      image:
        description: Hosted agents only - digest reference of the image an earlier deploy of this run used
        type: string
        default: ""
    outputs:
      agent_name:
        value: ${{ jobs.deploy.outputs.agent_name }}
      agent_version:
        value: ${{ jobs.deploy.outputs.agent_version }}
      previous_version:
        value: ${{ jobs.deploy.outputs.previous_version }}
      fingerprint:
        value: ${{ jobs.deploy.outputs.fingerprint }}
      model_version:
        value: ${{ jobs.deploy.outputs.model_version }}
      policy_outcome:
        value: ${{ jobs.deploy.outputs.policy_outcome }}
      kind:
        value: ${{ jobs.deploy.outputs.kind }}
      image:
        description: Hosted agents - the image digest reference deployed in this environment
        value: ${{ jobs.deploy.outputs.image }}

permissions:
  id-token: write
  contents: read

env:
  TRIVY_VERSION: "0.76.2"

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Hosted versions take a few minutes to start; a build adds a few more.
    timeout-minutes: 45
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
    defaults:
      run:
        working-directory: cicd
    outputs:
      agent_name: ${{ steps.deploy.outputs.agent_name }}
      agent_version: ${{ steps.deploy.outputs.agent_version }}
      previous_version: ${{ steps.deploy.outputs.previous_version }}
      fingerprint: ${{ steps.deploy.outputs.fingerprint }}
      model_version: ${{ steps.deploy.outputs.model_version }}
      policy_outcome: ${{ steps.policy.outputs.policy_outcome }}
      kind: ${{ steps.kind.outputs.kind }}
      image: ${{ steps.deploy.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cicd/requirements.txt
      - run: pip install -r requirements.txt
      - name: Agent kind (agent.json)
        id: kind
        run: python -m agent_cicd.image --agent-dir "${{ inputs.agent_dir }}"
      - name: Check the GitHub Environment is configured
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID FOUNDRY_PROJECT_ENDPOINT; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Environment '${{ inputs.environment }}' is missing secrets:$missing (see cicd/README.md, One-time setup)"
            exit 1
          fi
          if [ "${{ steps.kind.outputs.kind }}" = "hosted" ] && [ -z "$AZURE_CONTAINER_REGISTRY" ]; then
            echo "::error::GitHub Environment '${{ inputs.environment }}' needs the variable AZURE_CONTAINER_REGISTRY (registry login server) for a hosted agent"
            exit 1
          fi
          if [ "${{ steps.kind.outputs.kind }}" = "hosted" ] && [ "${{ inputs.build_image }}" != "true" ] && [ -z "${{ inputs.image }}" ]; then
            echo "::error::Hosted agent: this deploy got no image from an earlier deploy (pass build_image or image)"
            exit 1
          fi
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # G2 runs before anything is created: a blocking finding (enforcement "enforce") stops this deploy.
      - name: "G2: config & residency (policy.json)"
        id: policy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: >-
          python -m agent_cicd.policy_gate --agent-dir "${{ inputs.agent_dir }}" --env "${{ inputs.environment }}"
          --report "out/policy-${{ inputs.environment }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: policy-report-${{ inputs.environment }}
          path: cicd/out/policy-${{ inputs.environment }}.json
          if-no-files-found: ignore
      # G1 for hosted agents, after G2 has checked the registry: nothing is pushed unless the image builds and
      # passes the vulnerability scan.
      - name: "G1: build and scan the hosted agent image"
        id: build
        if: steps.kind.outputs.kind == 'hosted' && inputs.build_image
        run: bash ../.github/scripts/build-scan-image.sh "${{ inputs.agent_dir }}" "${GITHUB_SHA}" out/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outcome == 'success'
        with:
          name: image-sbom
          path: cicd/out/sbom.cdx.json
      - name: Push the image and record its digest
        id: push
        if: steps.build.outcome == 'success'
        run: |
          registry=$(echo "$AZURE_CONTAINER_REGISTRY" | tr '[:upper:]' '[:lower:]')
          target="${registry}/${{ steps.build.outputs.repository }}:${GITHUB_SHA}"
          az acr login --name "${registry%%.*}"
          docker tag "${{ steps.build.outputs.local_image }}" "$target"
          docker push "$target"
          image=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$target" | grep "^${registry}/" | head -n 1)
          [ -n "$image" ] || { echo "::error::could not read the pushed image digest"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pushed $image" >> "$GITHUB_STEP_SUMMARY"

      - name: Create agent version from code
        id: deploy
        run: >-
          python -m agent_cicd.deploy --agent-dir "${{ inputs.agent_dir }}" --env "${{ inputs.environment }}"
          --image "${{ steps.push.outputs.image || inputs.image }}"

      - name: Smoke test the recorded version
        id: smoke
        run: >-
          python -m agent_cicd.smoke --agent-dir "${{ inputs.agent_dir }}" --env "${{ inputs.environment }}"
          --version "${{ steps.deploy.outputs.agent_version }}"

      - name: Roll back to the previous version
        # A failed smoke test, or a hosted version that was created but never became active.
        if: >-
          failure() && inputs.rollback_on_smoke_failure && steps.deploy.outputs.previous_version != '' &&
          (steps.smoke.outcome == 'failure' || steps.deploy.outcome == 'failure')
        run: >-
          python -m agent_cicd.deploy --agent-dir "${{ inputs.agent_dir }}" --env "${{ inputs.environment }}"
          --rollback-to "${{ steps.deploy.outputs.previous_version }}"
