# Manual prod rollback for one agent (cicd/agents/my-agent), with the release manager's approval.
# Automatic rollback already happens inside a release when prod fails its smoke checks (agent-deploy.yml).
# Use this one when a problem shows up later.
#
# How: Actions -> my-agent-rollback-prod -> Run workflow
#   * "Use workflow from": Tags -> the release tag you want prod to go back to (for example my-agent-v1.2.0).
#     The prod environment only accepts release tags, and the tag's agent files are used to check the version.
#   * version: the prod agent version that release deployed (see its approval issue or the Foundry portal).
#   * reason: why (an incident number is enough). It is recorded on the new version and on the release issue.
# The job waits for the release manager to approve `prod`, recreates that version as the newest one
# (hosted agents: the same image digest), runs the smoke checks and posts the result to the release issue.
# Copy this file with agent-release.yml when you add an agent and replace "my-agent" in the copy.
name: my-agent-rollback-prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prod agent version to restore (a version the pipeline released)
        type: string
        required: true
      reason:
        description: Why (incident or ticket number)
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AGENT_DIR: agents/my-agent

jobs:
  check:
    name: Check the request
    runs-on: ubuntu-latest
    steps:
      - name: Started from a release tag with a version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "${GITHUB_REF}" in
            refs/tags/my-agent-v*) ;;
            *) echo "::error::Run this workflow from the release tag you are going back to (Use workflow from -> Tags), not ${GITHUB_REF}"; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::version must be a number, got '$VERSION'"; exit 1; }

  rollback:
    name: "Roll back prod to ${{ inputs.version }} (release manager approves)"
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    # Never at the same time as a release deploying prod.
    concurrency:
      group: my-agent-prod-deploy
      cancel-in-progress: false
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      VERSION: ${{ inputs.version }}
      REASON: ${{ inputs.reason }}
    defaults:
      run:
        working-directory: cicd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cicd/requirements.txt
      - run: pip install -r requirements.txt
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Recreate the released version as the newest prod version
        id: rollback
        run: >-
          python -m agent_cicd.deploy --agent-dir "$AGENT_DIR" --env prod
          --rollback-to "$VERSION" --require-released --reason "$REASON"
      - name: Smoke test the restored version
        id: smoke
        run: python -m agent_cicd.smoke --agent-dir "$AGENT_DIR" --env prod --version "${{ steps.rollback.outputs.agent_version }}"
      - name: Record the rollback on the release issue
        if: always() && steps.rollback.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.rollback.outcome == 'success' && steps.smoke.outcome == 'success' && 'restored and smoke-tested' || 'FAILED - see the run log' }}
          NEW_VERSION: ${{ steps.rollback.outputs.agent_version }}
        run: |
          mkdir -p out
          {
            echo "### ↩️ Prod rollback: ${OUTCOME}"
            echo ""
            echo "- Restored version: ${VERSION} (release ${GITHUB_REF_NAME}) as new version ${NEW_VERSION:-none}"
            echo "- Reason: ${REASON}"
            echo "- Requested by: ${GITHUB_ACTOR}; approved in the prod environment"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > out/rollback.md
          cat out/rollback.md >> "$GITHUB_STEP_SUMMARY"
          bash ../.github/scripts/release-issue.sh out/rollback.md || echo "could not post to the release issue"
